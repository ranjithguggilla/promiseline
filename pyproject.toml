[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promiseline"
version = "0.1.0"
description = "Late-delivery risk at checkout and carrier handoff for marketplace orders, with drift-aware calibration"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "haversine>=2.9",
    "scikit-lego>=0.9",
    "PyALE>=1.2",
    "DoubleML>=0.10",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
promiseline = "promiseline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E402"]
